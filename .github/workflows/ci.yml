name: CI

on:
  push:
    branches:
      - main
      - master
      - v2-nova-versao
  pull_request:

jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Ruff lint
        run: cd backend && ruff check .

      - name: Ruff format check
        run: cd backend && ruff format --check .

      - name: Run migrations (SQLite)
        run: USE_SQLITE=true python backend/manage.py migrate --noinput

      - name: Django system checks
        run: USE_SQLITE=true python backend/manage.py check

      - name: Run backend tests
        run: cd backend && USE_SQLITE=true pytest -q

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Prettier check
        run: npm run format:check --prefix frontend

      - name: ESLint
        run: npm run lint --prefix frontend

      - name: Typecheck
        run: npm run typecheck --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend
